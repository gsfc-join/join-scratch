[project]
name = "amsr2-icechunk-batch"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.13"
icechunk = ">=2.0.4,<3"
virtualizarr = ">=2.6.1,<3"
h5py = ">=3.10"
obstore = ">=0.9.2,<0.10"
boto3 = ">=1.34"
numpy = ">=1.26"
zarr = ">=3.1,<4"

[tool.pixi.environments]
icechunk = { features = [], no-default-feature = false }
