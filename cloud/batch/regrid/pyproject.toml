[project]
name = "amsr2-regrid-batch"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"
esmf = { version = "8.*", build = "nompi_*" }
numpy = ">=1.26"
xarray = ">=2024.1"
h5netcdf = ">=1.3"
netcdf4 = ">=1.7"
pyproj = ">=3.6"
pyresample = ">=1.27"
boto3 = ">=1.34"

[tool.pixi.environments]
batch = { features = [], no-default-feature = false }
