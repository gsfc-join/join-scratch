[project]
name = "amsr2-regrid-consumer"
version = "0.1.0"
description = "Consumer script for reading the AMSR2 IceChunk store and applying ESMF regridding weights with Dask."
requires-python = ">=3.11"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.feature.consumer.dependencies]
python = ">=3.11,<3.13"
icechunk = ">=2.0.4,<3"
xarray = ">=2024.1"
zarr = ">=3.1,<4"
dask = ">=2024.1"
distributed = ">=2024.1"   # LocalCluster
scipy = ">=1.12"
numpy = ">=1.26"
netcdf4 = ">=1.7"          # read ESMF weights file
h5netcdf = ">=1.3"         # write output NetCDF
boto3 = ">=1.34"
obstore = ">=0.9.2,<0.10"
pyproj = ">=3.6"           # CRS / WKT for CF grid_mapping

[tool.pixi.feature.consumer.tasks]
regrid = "python regrid_consumer.py"

[tool.pixi.environments]
# Standalone environment — does not inherit the repo-root default feature.
consumer = { features = ["consumer"], no-default-feature = true }
